<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>💖 cute choice · yes or no</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;              /* 🔒 locks fullscreen, no scroll */
            position: fixed;               /* keeps viewport locked */
            top: 0;
            left: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #ffe9f4 0%, #ffe0ed 100%);
            background-attachment: fixed;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;              /* extra safety */
        }

        /* CUTE BACKGROUND — floating pastel shapes */
        .bg-deco {
            position: fixed;
            font-size: 3rem;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        /* main card – glassmorphism */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 245, 248, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 64px 64px 48px 48px;
            box-shadow: 0 20px 50px rgba(255, 120, 160, 0.15),
                        0 8px 20px rgba(255, 200, 220, 0.3),
                        inset 0 2px 4px rgba(255, 255, 255, 0.6);
            padding: 3rem 3.5rem 4rem;
            max-width: 700px;
            width: 100%;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
            margin: 0 1rem;
        }

        .big-message {
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 2.2rem;
            word-break: break-word;
            line-height: 1.2;
            background: linear-gradient(135deg, #b34b6a, #d66b8a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 8px rgba(255, 140, 180, 0.2));
        }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.2rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            position: relative;
        }

        .btn {
            border: none;
            background: white;
            padding: 1rem 2.8rem;
            font-size: 1.8rem;
            font-weight: 600;
            border-radius: 80px;
            cursor: pointer;
            box-shadow: 0 8px 0 #d9b0c0, 0 10px 24px rgba(200, 100, 130, 0.2);
            transition: all 0.08s ease;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #4e2d3b;
            min-width: 140px;
            position: relative;
            transform: translateY(-2px);
            touch-action: manipulation;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b38b9b;
        }

        .btn-yes {
            background: #ffd9e6;
            color: #772c47;
            box-shadow: 0 8px 0 #cb96ab, 0 10px 24px rgba(230, 120, 160, 0.3);
        }

        .btn-yes:hover {
            background: #ffd0e0;
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 10px 0 #b87c91, 0 14px 28px rgba(230, 120, 160, 0.3);
        }

        .btn-yes:active {
            transform: scale(0.98) translateY(4px);
            box-shadow: 0 4px 0 #b87c91;
        }

        .btn-no {
            background: #e3f0ff;
            color: #2d4a6b;
            box-shadow: 0 8px 0 #a6bcd9, 0 10px 24px rgba(100, 150, 200, 0.2);
            transition: left 0.08s ease, top 0.08s ease, transform 0.08s ease;
            position: relative; /* will be overridden by JS to 'fixed' */
            cursor: pointer;
            z-index: 999;
            touch-action: none;
        }

        .btn-no:hover {
            background: #d6eaff;
            transform: scale(1.02);
            box-shadow: 0 10px 0 #8ea8c9, 0 14px 28px rgba(100, 150, 200, 0.25);
        }

        .btn-no:active {
            transform: scale(0.96);
        }

        @media (max-width: 500px) {
            .card { padding: 2rem 1.5rem 2.8rem; margin: 0 0.5rem; }
            .big-message { font-size: 2.8rem; }
            .btn { padding: 0.8rem 1.8rem; font-size: 1.5rem; min-width: 110px; }
            .button-group { gap: 1.5rem; }
        }

        .footnote {
            margin-top: 2.5rem;
            font-size: 0.9rem;
            color: #af7d8d;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .footnote span {
            display: inline-block;
            animation: floaty 3s infinite alternate ease-in-out;
        }

        @keyframes floaty {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>
    <!-- decorative background elements (fixed) -->
    <div class="bg-deco" style="top:12%; left:8%;">🌸</div>
    <div class="bg-deco" style="bottom:18%; right:5%;">🌼</div>
    <div class="bg-deco" style="top:38%; left:4%;">🍭</div>
    <div class="bg-deco" style="bottom:28%; right:14%;">🐇</div>
    <div class="bg-deco" style="top:70%; left:12%;">✨</div>
    <div class="bg-deco" style="top:10%; right:16%;">☁️</div>

    <!-- main card -->
    <div class="card">
        <div class="big-message">
            💗  will u still accept me as your love 💗
        </div>

        <div class="button-group" id="buttonGroup">
            <button class="btn btn-yes" id="yesBtn">💖 YES</button>
            <button class="btn btn-no" id="noBtn">💔 NO</button>
        </div>

        <div class="footnote">
            <span>✨ Choose carefully ✨</span>
        </div>
    </div>

    <script>
        (function() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            // ---- YES button: opens a cute message in new window ----
            yesBtn.addEventListener('click', function(e) {
                const messageHTML = `
                <!DOCTYPE html>
                <html>
                <head><meta charset="UTF-8"><title>yay! 💖</title>
                <style>
                    * { margin:0; padding:0; box-sizing:border-box; }
                    body {
                        min-height: 100vh;
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        background: linear-gradient(145deg, #ffe4ef, #ffd6e6);
                        font-family: 'Segoe UI', 'Quicksand', sans-serif;
                        padding: 2rem;
                        text-align: center;
                        overflow: hidden;
                    }
                    .msg-box {
                        background: rgba(255, 255, 255, 0.6);
                        backdrop-filter: blur(8px);
                        padding: 3.5rem 4rem;
                        border-radius: 80px 20px 80px 20px;
                        box-shadow: 0 20px 50px rgba(255, 80, 120, 0.2);
                        border: 2px solid rgba(255, 255, 255, 0.6);
                        max-width: 600px;
                    }
                    h1 {
                        font-size: 4.2rem;
                        background: linear-gradient(135deg, #b34b6a, #e06b8a);
                        -webkit-background-clip: text;
                        background-clip: text;
                        -webkit-text-fill-color: transparent;
                        filter: drop-shadow(0 6px 12px rgba(255, 130, 170, 0.3));
                        margin-bottom: 1rem;
                    }
                    p {
                        font-size: 1.8rem;
                        color: #4a2f3a;
                        font-weight: 500;
                        letter-spacing: 1px;
                    }
                    .emoji-big { font-size: 4rem; display: block; margin: 0.5rem 0; }
                    .back-link {
                        margin-top: 2.5rem;
                        display: inline-block;
                        background: #ffd9e6;
                        padding: 0.8rem 2rem;
                        border-radius: 60px;
                        text-decoration: none;
                        color: #712d47;
                        font-weight: 600;
                        box-shadow: 0 6px 0 #c292a5;
                        transition: 0.08s ease;
                        border: 2px solid white;
                        cursor: pointer;
                    }
                    .back-link:active { transform: translateY(4px); box-shadow: 0 2px 0 #c292a5; }
                </style>
                </head>
                <body>
                    <div class="msg-box">
                        <span class="emoji-big">🥰💖</span>
                        <h1>YES!</h1>
                        <p>you made my day!<br>💗 I love u soo much Ruhika 💗</p>
                        <p style="font-size:2.6rem; margin-top:0.8rem;">✨🌷✨</p>
                        <div class="back-link" onclick="window.close(); return false;">❤️ close this ❤️</div>
                    </div>
                </body>
                </html>
                `;
                const blob = new Blob([messageHTML], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                setTimeout(() => { URL.revokeObjectURL(url); }, 5000);
            });

            // ---- helpers: safe position inside viewport (no scroll) ----
            function getViewport() {
                return {
                    w: window.innerWidth,
                    h: window.innerHeight
                };
            }

            function clampPos(left, top, btnW, btnH, pad = 20) {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                left = Math.min(Math.max(left, pad), vw - btnW - pad);
                top = Math.min(Math.max(top, pad), vh - btnH - pad);
                return { left, top };
            }

            // ---- move NO button to random safe position ----
            function moveNoButton() {
                const rect = noBtn.getBoundingClientRect();
                const bw = rect.width || 140;
                const bh = rect.height || 70;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const pad = 20;

                const maxX = Math.max(pad, vw - bw - pad);
                const maxY = Math.max(pad, vh - bh - pad);
                let newX = Math.floor(Math.random() * (maxX - pad + 1)) + pad;
                let newY = Math.floor(Math.random() * (maxY - pad + 1)) + pad;
                // clamp
                const clamped = clampPos(newX, newY, bw, bh, pad);
                noBtn.style.position = 'fixed';
                noBtn.style.left = clamped.left + 'px';
                noBtn.style.top = clamped.top + 'px';
                noBtn.style.zIndex = '999';
                noBtn.style.transition = 'left 0.08s ease, top 0.08s ease';
            }

            // ---- place NO beside YES initially ----
            function placeNoButtonBesideYes() {
                const yesRect = yesBtn.getBoundingClientRect();
                const noWidth = noBtn.offsetWidth || 140;
                const noHeight = noBtn.offsetHeight || 70;
                const gap = 20;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const pad = 20;

                let leftPos = yesRect.right + gap;
                let topPos = yesRect.top;

                // if off right → place below YES
                if (leftPos + noWidth > vw - pad) {
                    leftPos = yesRect.left;
                    topPos = yesRect.bottom + gap;
                }
                // if still off (narrow) → random safe
                if (topPos + noHeight > vh - pad || leftPos + noWidth > vw - pad) {
                    const randX = Math.floor(Math.random() * (vw - noWidth - pad * 2)) + pad;
                    const randY = Math.floor(Math.random() * (vh - noHeight - pad * 2)) + pad;
                    leftPos = randX;
                    topPos = randY;
                }
                const clamped = clampPos(leftPos, topPos, noWidth, noHeight, pad);
                noBtn.style.position = 'fixed';
                noBtn.style.left = clamped.left + 'px';
                noBtn.style.top = clamped.top + 'px';
                noBtn.style.zIndex = '999';
                noBtn.style.transition = 'left 0.08s ease, top 0.08s ease';
            }

            // ---- flee events ----
            noBtn.addEventListener('mouseover', function(e) {
                moveNoButton();
            });

            document.addEventListener('mousemove', function(e) {
                const noRect = noBtn.getBoundingClientRect();
                const margin = 70;
                const dangerZone = {
                    left: noRect.left - margin,
                    right: noRect.right + margin,
                    top: noRect.top - margin,
                    bottom: noRect.bottom + margin
                };
                const mx = e.clientX;
                const my = e.clientY;
                if (mx >= dangerZone.left && mx <= dangerZone.right &&
                    my >= dangerZone.top && my <= dangerZone.bottom) {
                    moveNoButton();
                }
            });

            noBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                moveNoButton();
            });

            // ---- keep inside viewport on resize / orientation ----
            window.addEventListener('resize', function() {
                const rect = noBtn.getBoundingClientRect();
                const bw = rect.width || 140;
                const bh = rect.height || 70;
                let left = parseFloat(noBtn.style.left) || 0;
                let top = parseFloat(noBtn.style.top) || 0;
                const clamped = clampPos(left, top, bw, bh, 20);
                noBtn.style.left = clamped.left + 'px';
                noBtn.style.top = clamped.top + 'px';
            });

            // ---- init ----
            function init() {
                requestAnimationFrame(() => {
                    placeNoButtonBesideYes();
                });
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

            // extra safety after load & orientation
            setTimeout(() => { placeNoButtonBesideYes(); }, 300);
            window.addEventListener('orientationchange', function() {
                setTimeout(placeNoButtonBesideYes, 350);
            });

            // also re-run after a tiny delay to catch any layout shifts
            setTimeout(() => { placeNoButtonBesideYes(); }, 500);
        })();
    </script>

</body>
</html>
